      var d = S.escalaData || daISO(S.op.hoje);
      api("GET", "/api/op/escala-semana?data=" + iso(d)).then(function (semana) {
        desenharEscalas(semana, d);
      }).catch(erroNoCorpo);
    });
  }

  function desenharEscalas(semana, d) {
    var ini = daISO(semana[0].data), fim = daISO(semana[6].data);

    var dias = semana.map(function (e) {
      var turnos = e.turnos.length
        ? e.turnos.map(function (t) {
            return '<div class="turno"><div class="h">' + esc(t.inicio) + " – " + esc(t.fim) + "</div>" +
              '<div class="pessoas">' + (t.vets.length
                ? t.vets.map(function (v) {
                    return '<span class="pessoa">' + esc(v.nome || nomeVet(v.vetId)) + "</span>";
                  }).join("")
                : '<span class="ajuda">Ninguém neste turno.</span>') + "</div></div>";
          }).join("")
        : '<div class="ajuda">Ninguém escalado neste dia.</div>';

      var ausentes = e.ausentes.map(function (a) {
        return '<span class="selo aviso">' + esc(a.nome) + " · " +
          esc(S.op.ausenciaRotulo[a.tipo]) + "</span>";
      }).join(" ");

      var bloqueios = e.bloqueios.map(function (b) {
        return '<span class="selo info">' + esc(b.motivo) + " " + esc(b.inicio) +
          "–" + esc(b.fim) + "</span>";
      }).join(" ");

      return '<div class="dia-bloco">' +
        '<div class="cab"><h4>' + esc(e.diaSemana) + ", " + esc(br(e.data)) + "</h4>" +
          '<span class="selo ' + (e.derivada ? "info" : "aviso") + '">' +
            (e.derivada ? "Automática" : "Ajustada") + "</span>" +
          '<button class="btn secundario pequeno" data-editar-escala="' + esc(e.data) + '">Editar</button>' +
          (e.derivada ? "" :
            '<button class="btn secundario pequeno" data-voltar-escala="' + esc(e.data) + '">Desfazer ajuste</button>') +
        "</div>" +
        (e.observacao ? '<div class="ajuda" style="margin-bottom:8px">' + esc(e.observacao) + "</div>" : "") +
        turnos +
        (ausentes || bloqueios
          ? '<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">' + ausentes + " " + bloqueios + "</div>"
          : "") +
      "</div>";
    }).join("");

    casca("Escalas",
      "Semana de " + br(semana[0].data) + " a " + br(semana[6].data), "",
      '<div class="agenda-topo">' +
        '<div class="setas-data">' +
          '<button id="anterior" aria-label="Semana anterior">&#8249;</button>' +
          '<button id="proximo" aria-label="Próxima semana">&#8250;</button>' +
        "</div>" +
        '<button class="btn secundario pequeno" id="hoje">Esta semana</button>' +
        '<div class="titulo"></div>' +
      "</div>" +
      '<div class="aviso" style="background:#eef8fb;color:#2b7f96">A escala sai sozinha da ' +
        "disponibilidade de cada veterinário, já descontando férias e folgas. " +
        "Editar um dia cria um ajuste só para ele.</div>" +
      dias, true);

    document.getElementById("anterior").onclick = function () {
      S.escalaData = maisDias(d, -7); telaEscalas();
    };
    document.getElementById("proximo").onclick = function () {
      S.escalaData = maisDias(d, 7); telaEscalas();
    };
    document.getElementById("hoje").onclick = function () {
      S.escalaData = daISO(S.op.hoje); telaEscalas();
    };
    app.querySelectorAll("[data-editar-escala]").forEach(function (b) {
      b.onclick = function () {
        var e = semana.filter(function (x) { return x.data === b.dataset.editarEscala; })[0];
        formEscala(e);
      };
    });
    app.querySelectorAll("[data-voltar-escala]").forEach(function (b) {
      b.onclick = function () {
        confirmar("Desfazer o ajuste",
          "O dia " + br(b.dataset.voltarEscala) + " volta a seguir a disponibilidade de cada um.",
          "Desfazer", function () {
            api("POST", "/api/op/escala/remover", {data: b.dataset.voltarEscala})
              .then(function () {
                S.aviso = {tipo: "ok", texto: "Ajuste desfeito."};
                telaEscalas();
              })
              .catch(function (e) { S.aviso = {tipo: "erro", texto: e.message}; telaEscalas(); });
          });
      };
    });
  }

  function formEscala(e) {
    var turnos = JSON.parse(JSON.stringify(e.turnos));

    function html() {
      return turnos.map(function (t, i) {
        var marcados = (S.op.vets || []).map(function (v) {
          var tem = t.vets.some(function (x) { return x.vetId === v.id; });
          return '<label style="display:flex;gap:7px;align-items:center;font-weight:400;font-size:.875rem">' +
            '<input type="checkbox" style="width:auto" data-turno="' + i + '" value="' + esc(v.id) + '"' +
            (tem ? " checked" : "") + "/>" + esc(v.nome) + "</label>";
        }).join("");
        return '<div class="turno">' +
          '<div class="periodo">' +
            '<input type="time" value="' + esc(t.inicio) + '" data-t="' + i + '" data-c="inicio"/>' +
            "<span>até</span>" +
            '<input type="time" value="' + esc(t.fim) + '" data-t="' + i + '" data-c="fim"/>' +
            '<button class="x" data-remove-turno="' + i + '">×</button>' +
          "</div>" + marcados + "</div>";
      }).join("") || '<div class="ajuda">Nenhum turno ainda.</div>';
    }

    modal(
      "<h3>Escala de " + esc(br(e.data)) + "</h3>" +
      '<p class="sub">' + esc(e.diaSemana) + '. Marque quem trabalha em cada turno.</p>' +
      '<div id="avisoModal"></div>' +
      '<div id="turnos">' + html() + "</div>" +
      '<button class="btn secundario pequeno" id="addTurno" style="margin-top:6px">+ Turno</button>' +
      '<div class="campo curto" style="margin-top:16px"><label for="e_obs">Observação</label>' +
        '<input id="e_obs" value="' + esc(e.observacao || "") + '" placeholder="Plantão reforçado, feriado…"/></div>' +
      '<div class="rodape">' +
        '<button class="btn secundario" data-fechar>Voltar</button>' +
        '<button class="btn verde" id="salvarEsc">Salvar escala</button>' +
      "</div>",
      function (v) {
        function ligar() {
          v.querySelector("#turnos").innerHTML = html();
          v.querySelectorAll("[data-c]").forEach(function (inp) {
            inp.onchange = function () { turnos[+inp.dataset.t][inp.dataset.c] = inp.value; };
          });
          v.querySelectorAll("[data-remove-turno]").forEach(function (b) {
            b.onclick = function () { turnos.splice(+b.dataset.removeTurno, 1); ligar(); };
          });
          v.querySelectorAll("[data-turno]").forEach(function (c) {
            c.onchange = function () {
              var t = turnos[+c.dataset.turno];
              if (c.checked) {
                t.vets.push({vetId: c.value, nome: nomeVet(c.value)});
              } else {
                t.vets = t.vets.filter(function (x) { return x.vetId !== c.value; });
              }
            };
          });
        }
        ligar();

        v.querySelector("#addTurno").onclick = function () {
          turnos.push({inicio: "08:00", fim: "12:00", vets: []});
          ligar();
        };
        v.querySelector("[data-fechar]").onclick = fecharModal;
        v.querySelector("#salvarEsc").onclick = function () {
          var b = this;
          b.disabled = true; b.textContent = "Salvando…";
          api("POST", "/api/op/escala", {
            data: e.data, turnos: turnos, observacao: v.querySelector("#e_obs").value
          }).then(function () {
            fecharModal();
            S.aviso = {tipo: "ok", texto: "Escala de " + br(e.data) + " salva."};
            telaEscalas();
          }).catch(function (err) {
            b.disabled = false; b.textContent = "Salvar escala";
            alerta(v, err.message);
          });
        };
      });
  }

  function telaCancelamentos() {

      api("GET", "/api/op/atendimentos").then(function (lista) {
        S.atendimentos = lista;
        var cancelados = lista.filter(function (a) { return a.status === "cancelado"; })
          .sort(function (a, b) {
            return String(b.canceladoEm || "").localeCompare(String(a.canceladoEm || ""));
          });

        var porMotivo = {};
        cancelados.forEach(function (a) {
          var m = a.motivoCancelamento || "Outro";
          porMotivo[m] = (porMotivo[m] || 0) + 1;
        });

          return card(porMotivo[m], m);
        }).join("");

        var itens = cancelados.map(function (a) {
          return '<div class="cartao">' +
            '<div class="dados"><div class="nome">' + esc(a.paciente) + " · " +
              esc(br(a.data)) + " às " + esc(a.inicio) + "</div>" +
              '<div class="meta">' + esc(a.motivoCancelamento || "Sem motivo") +
              " · cancelado por " + esc(a.canceladoPor || "—") +
              (a.canceladoEm ? " em " + esc(a.canceladoEm.slice(0, 16)) : "") + "</div></div>" +
            '<span class="selo perigo">Cancelado</span>' +
            '<button class="btn secundario pequeno" data-remarcar="' + esc(a.id) + '">Reagendar</button>' +
            '<button class="btn secundario pequeno" data-ver="' + esc(a.id) + '">Ver</button>' +
          "</div>";
        }).join("");

        casca("Cancelamentos", cancelados.length + " no total", "",
          (cancelados.length
            ? '<div class="cards">' + cards + "</div>" + itens
            : '<div class="vazio"><p>Nenhum atendimento cancelado até agora.</p></div>'));

        app.querySelectorAll("[data-ver]").forEach(function (b) {
          b.onclick = function () {

  /* =============================================== TELA: HISTORICO === */
  function telaHistorico() {
    carregando("Histórico");
    comOperacao(function () {
      api("GET", "/api/op/auditoria").then(function (log) {
        var itens = log.map(function (l) {
          return '<div class="cartao">' +
            '<div class="dados"><div class="nome">' + esc(l.resumo) + "</div>" +
              '<div class="meta">' + esc(l.acao) + " · " + esc(l.quem) +
              " · " + esc(l.quando) + "</div></div></div>";
        }).join("");

        casca("Histórico", "As últimas " + log.length + " ações", "",
          log.length ? itens :
            '<div class="vazio"><p>Nada registrado ainda.</p></div>');
      }).catch(erroNoCorpo);
    });
  }

  /* ============================================================ inicio === */
  function iniciar() {
    return api("GET", "/api/sessao").then(function (s) {
      if (s.baseFotos) S.baseFotos = s.baseFotos;
      if (typeof s.urlSite === "string") S.urlSite = s.urlSite;
      S.quem = s.quem || "";
      S.temOperacao = !!s.operacao;
      S.motivoSemOperacao = s.operacaoMotivo || "";
      S.ondeOperacao = s.operacaoOnde || "";
      if (!s.autenticado) return telaLogin();
      desenhar();
    });
  }

  iniciar();
})();
</script>
