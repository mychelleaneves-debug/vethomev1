<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Veterinário — VetHome</title>
<meta name="description" content="Conheça o profissional da equipe VetHome que vai atender o seu pet em casa."/>
<link href="css/template.css" rel="stylesheet" type="text/css"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous"/>
<script src="js/vendor/webfont.js" type="text/javascript"></script>
<script type="text/javascript">WebFont.load({ google: { families: ["Nunito:400,500,600"] } });</script>
<link href="assets/favicon.ico" rel="shortcut icon" type="image/x-icon"/>
<link href="assets/webclip.png" rel="apple-touch-icon"/>
<link href="css/vethome.css" rel="stylesheet" type="text/css"/>
<style>
  /* Página individual do veterinário.
     Usa as mesmas variáveis, fontes e formas do resto do site: fundo
     azul-claro da seção da equipe, card branco com borda escura de 3px e
     sombra deslocada, exatamente como os cards da grade. */
  .perfil-pagina{
    background-color:var(--light-blue);
    min-height:100vh;
    padding:34px 20px 70px;
  }
  .perfil-topo{
    max-width:760px;
    margin:0 auto 26px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .perfil-topo img{width:168px;height:auto}
  .perfil-voltar{
    display:inline-flex;
    align-items:center;
    column-gap:8px;
    color:var(--dark);
    font-weight:700;
    font-size:.9375rem;
    text-decoration:none;
    padding:10px 16px;
    border:2px solid var(--dark);
    border-radius:170px;
    background:var(--white);
    transition:background-color .2s ease,color .2s ease;
  }
  .perfil-voltar:hover{background:var(--dark);color:var(--white)}

  .perfil-card{
    max-width:760px;
    margin:0 auto;
    background:var(--white);
    border:3px solid var(--dark);
    border-radius:30px;
    box-shadow:10px 12px 0 0 var(--purple);
    padding:44px 46px 40px;
  }

  .perfil-cabeca{
    display:flex;
    align-items:center;
    column-gap:28px;
    row-gap:18px;
    flex-wrap:wrap;
  }
  .perfil-foto{
    width:150px;height:150px;
    border-radius:50%;
    object-fit:cover;
    flex:none;
    background:var(--light-blue);
  }
  .perfil-nome{margin:0}
  .perfil-cargo{margin:4px 0 0;color:var(--dark-grey)}
  .perfil-esp{margin:2px 0 0;font-weight:700}

  .perfil-bloco{margin-top:34px}
  .perfil-bloco h2{
    font-family:Otomanopeeone,sans-serif;
    font-size:.75rem;
    font-weight:400;
    letter-spacing:.14rem;
    text-transform:uppercase;
    color:var(--dark-grey);
    margin:0 0 12px;
  }
  .perfil-bloco p{margin:0}

  .perfil-areas{
    display:flex;flex-wrap:wrap;gap:9px;
    list-style:none;margin:0;padding:0;
  }
  .perfil-areas li{
    background:var(--light-blue);
    color:var(--dark);
    border-radius:170px;
    padding:7px 16px;
    font-size:.9375rem;
    font-weight:700;
  }

  .perfil-agendar{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    column-gap:10px;
    margin-top:36px;
    width:100%;
    background-color:#25d366;
    color:var(--white);
    padding:16px 24px;
    border-radius:170px;
    font-size:1rem;
    font-weight:700;
    text-decoration:none;
    transition:background-color .2s ease;
  }
  .perfil-agendar:hover{background-color:#1da851}
  .perfil-agendar:focus-visible{outline:3px solid var(--dark);outline-offset:3px}

  .perfil-erro{
    max-width:760px;margin:0 auto;background:var(--white);
    border:3px solid var(--dark);border-radius:30px;padding:44px;text-align:center;
  }

  @media screen and (max-width:767px){
    .perfil-pagina{padding:20px 16px 60px}
    .perfil-topo{margin-bottom:18px}
    .perfil-topo img{width:140px}
    .perfil-voltar{padding:9px 14px;font-size:.875rem}
    .perfil-card{padding:26px 22px 30px;border-radius:24px;box-shadow:7px 8px 0 0 var(--purple)}
    .perfil-cabeca{column-gap:18px}
    .perfil-foto{width:104px;height:104px}
    .perfil-bloco{margin-top:26px}
  }
  @media screen and (max-width:400px){
    .perfil-cabeca{flex-direction:column;align-items:flex-start}
  }
</style>
</head>
<body>

<main class="perfil-pagina">
  <div class="perfil-topo">
    <a href="index.html" aria-label="Voltar para a página inicial da VetHome">
      <img src="assets/logo-vethome.png" alt="VetHome"/>
    </a>
    <a class="perfil-voltar" href="index.html#Our-Team">&larr; Ver toda a equipe</a>
  </div>
  <div id="perfil"></div>
</main>

<script>
(function () {
  "use strict";

  var WHATS = "https://wa.me/5561982864948";
  var alvo = document.getElementById("perfil");

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* a biografia vem do painel com quebras de linha; preserva os parágrafos */
  function paragrafos(texto) {
    return esc(texto).replace(/\n{2,}/g, "<br><br>").replace(/\n/g, "<br>");
  }

  function bloco(titulo, conteudo) {
    return conteudo
      ? '<div class="perfil-bloco"><h2>' + titulo + "</h2>" + conteudo + "</div>"
      : "";
  }

  function erro(msg) {
    alvo.innerHTML =
      '<div class="perfil-erro">' +
        '<h1 class="h4">' + esc(msg) + "</h1>" +
        '<p class="paragraph dark-grey-color" style="margin-top:12px">' +
          'Volte para a equipe e escolha um profissional.</p>' +
      "</div>";
  }

  function montar(vet) {
    document.title = vet.nome + " — VetHome";

    var mensagem = "Olá! Gostaria de agendar um atendimento com " + vet.nome + ".";
    var link = WHATS + "?text=" + encodeURIComponent(mensagem);

    var areas = (vet.areas || []).filter(Boolean);
    var listaAreas = areas.length
      ? '<ul class="perfil-areas">' + areas.map(function (a) {
          return "<li>" + esc(a) + "</li>";
        }).join("") + "</ul>"
      : "";

    alvo.innerHTML =
      '<article class="perfil-card">' +
        '<div class="perfil-cabeca">' +
          '<img class="perfil-foto" src="' + esc(vet.foto) + '" alt="' + esc(vet.nome) + '"/>' +
          "<div>" +
            '<h1 class="h4 perfil-nome">' + esc(vet.nome) + "</h1>" +
            (vet.cargo ? '<p class="paragraph perfil-cargo">' + esc(vet.cargo) + "</p>" : "") +
            (vet.especialidade ? '<p class="paragraph perfil-esp">' + esc(vet.especialidade) + "</p>" : "") +
            (vet.crmv ? '<span class="vet-crmv">' + esc(vet.crmv) + "</span>" : "") +
          "</div>" +
        "</div>" +

        bloco("Sobre o profissional",
              vet.descricao
                ? '<p class="paragraph dark-grey-color">' + paragrafos(vet.descricao) + "</p>"
                : "") +

        bloco("Áreas de atuação", listaAreas) +

        bloco("Região de atendimento",
              vet.cidade
                ? '<p class="paragraph dark-grey-color">' + esc(vet.cidade) + "</p>"
                : "") +

        '<a class="perfil-agendar" href="' + link + '" target="_blank" rel="noopener">' +
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
          '<path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.02a8.2 8.2 0 0 1-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.19 8.19 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.25-8.23 2.2 0 4.27.86 5.83 2.42a8.18 8.18 0 0 1 2.41 5.82c0 4.54-3.7 8.23-8.24 8.23Zm4.52-6.17c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.81-.79.98-.14.16-.29.19-.54.06-.25-.12-1.05-.38-1.99-1.23-.74-.65-1.23-1.46-1.38-1.71-.14-.25-.01-.38.11-.51.11-.11.25-.29.37-.43.13-.15.17-.25.25-.41.08-.17.04-.31-.02-.44-.06-.12-.56-1.35-.77-1.85-.2-.48-.4-.42-.56-.42h-.47c-.17 0-.44.06-.66.31-.23.25-.87.85-.87 2.07s.89 2.4 1.01 2.57c.13.16 1.75 2.67 4.24 3.75.59.25 1.05.4 1.41.52.59.19 1.13.16 1.56.1.47-.07 1.47-.6 1.68-1.18.2-.58.2-1.07.14-1.18-.06-.1-.23-.16-.48-.29Z"/>' +
          "</svg>Agendar atendimento</a>" +
      "</article>";
  }

  var slug = new URLSearchParams(location.search).get("vet");
  if (!slug) return erro("Nenhum veterinário indicado.");

  fetch("data/veterinarios.json", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (lista) {
      var vet = null;
      for (var i = 0; i < lista.length; i++) {
        if (lista[i].slug === slug) { vet = lista[i]; break; }
      }
      /* quem foi ocultado no painel também some da página individual */
      if (!vet || vet.status === "inativo") {
        return erro("Este perfil não está disponível.");
      }
      montar(vet);
    })
    .catch(function () {
      erro("Não foi possível carregar o perfil agora.");
    });
})();
</script>
</body>
</html>
